<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro Clock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
  <div class="text-center">
    <h1 class="h4">Pomodoro Clock</h1>
    <div class="d-flex align-items-center justify-content-center rounded-circle border border-danger border-5 mx-auto mb-4" style="width: 300px; height: 300px;">
  <div id="timeText" class="display-1">25:00</div>
</div>

    <button class="btn btn-dark btn-lg" onclick="startTimer()">Start</button>
    <button class="btn btn-secondary btn-lg" onclick="pauseTimer()">Pause</button>
    <button class="btn btn-outline-secondary btn-lg" onclick="resetTimer()">Reset</button>

    <div class="row mt-4">
      <div class="col-6">
        <label for="workInput" class="form-label">Work minutes</label>
        <input id="workInput" type="number" class="form-control text-center" value="25" min="1" onchange="resetTimer()">
      </div>
      <div class="col-6">
        <label for="breakInput" class="form-label">Break minutes</label>
        <input id="breakInput" type="number" class="form-control text-center" value="5" min="1">
      </div>
    </div>
  </div>
  <script src="PomodoroClock.js">   </script>
</body>
  </html>
